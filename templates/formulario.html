
{% extends "base.html" %}

{% block titulo %}Cadastro de Produto | Gestão Comercial{% endblock %}

{% block conteudo %}

<div class="mb-4">

    <h3 class="fw-bold">

        {% if produto %}
            Editar produto
        {% else %}
            Novo produto
        {% endif %}

    </h3>

    <p class="text-muted">
        Preencha as informações do produto.
    </p>

</div>


<div class="card">

    <div class="card-body p-4">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label fw-bold">
                    Nome do produto
                </label>

                <input type="text"
                       name="nome"
                       class="form-control"
                       value="{{ produto.nome if produto else '' }}"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label fw-bold">
                    Descrição
                </label>

                <textarea name="descricao"
                          class="form-control"
                          rows="3">{{ produto.descricao if produto else '' }}</textarea>

            </div>


            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label fw-bold">
                        Preço
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">R$</span>

                        <input type="number"
                               name="preco"
                               class="form-control"
                               step="0.01"
                               min="0"
                               value="{{ produto.preco if produto else '' }}"
                               required>

                    </div>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label fw-bold">
                        Estoque
                    </label>

                    <input type="number"
                           name="estoque"
                           class="form-control"
                           min="0"
                           value="{{ produto.estoque if produto else '' }}"
                           required>

                </div>

            </div>


            <hr>

            <div class="d-flex justify-content-end gap-2">

                <a href="{{ url_for('listar_produtos') }}"
                   class="btn btn-secondary">

                    Cancelar

                </a>

                <button type="submit" class="btn btn-primary">

                    <i class="bi bi-save"></i>
                    Salvar produto

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
